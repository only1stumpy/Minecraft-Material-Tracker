name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24.11.0]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: antville
          POSTGRES_PASSWORD: antville
          POSTGRES_DB: antville
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antville -d antville"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://antville:antville@localhost:5432/antville?schema=public
      TEST_DATABASE_URL: postgresql://antville:antville@localhost:5432/antville?schema=public
      BLOB_READ_WRITE_TOKEN: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
